services:
  - type: web
    name: nextx
    runtime: node
    plan: free
    buildCommand: "npx prisma generate && npx next build"
    startCommand: "NODE_ENV=production node server.js"
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nextx-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: NEXTAUTH_URL
        value: "https://nextx.onrender.com"
      - key: NEXT_PUBLIC_SOCKET_URL
        value: "https://nextx.onrender.com"
      - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:dev@nextx.local"
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: NEXT_PUBLIC_LIVEKIT_URL
        sync: false
      - key: YOOKASSA_SHOP_ID
        sync: false
      - key: YOOKASSA_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

databases:
  - name: nextx-db
    plan: free
    databaseName: nextx
    user: nextx
